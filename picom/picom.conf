#################################
#       Shadows / Fading        #
#################################

shadow = false;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

#################################
#          Animations           #
#################################

# Smooth, lightweight workspace switch: a quick fade (~0.15s).
# "show"/"hide" fire when i3 switches workspaces; "open"/"close" for windows.
# Blur fades together with the window so it doesn't pop in.
animations = (
  {
    triggers = ["show", "open"];
    opacity = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.15;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
  },
  {
    triggers = ["hide", "close"];
    opacity = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.12;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
  }
);

#################################
#           Opacity             #
#################################

inactive-opacity = 0.85;
inactive-opacity-override = false;
active-opacity = 1.0;

# Keep bars/launchers fully opaque regardless of the rules above.
opacity-rule = [
  "100:class_g = 'Polybar'",
  "100:class_g = 'Rofi'",
  "85:class_g = 'kitty' && focused",
  "75:class_g = 'kitty' && !focused"
];

#################################
#           Corners             #
#################################

corner-radius = 10;

rounded-corners-exclude = [
  "!(class_g = 'kitty')"
];

#################################
#     Background-Blurring       #
#################################

blur-background = true;
blur-background-frame = false;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "!(class_g = 'kitty')"
];

#################################
#       General Settings        #
#################################

backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
