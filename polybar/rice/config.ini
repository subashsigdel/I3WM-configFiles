[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/rice/colors.ini
include-file = ~/.config/polybar/rice/modules.ini

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
override-redirect = false

bottom = false
width = 100%
height = 35
offset-x = 0
offset-y = 0

background = ${color.background}
foreground = ${color.foreground}

radius-top = 0.0
radius-bottom = 0.0

line-size = 2
line-color = ${color.primary}

border-size = 0
padding-left = 2
padding-right = 2

module-margin-left = 1
module-margin-right = 1

font-0 = "Iosevka Nerd Font:pixelsize=14;4"
font-1 = "Iosevka Nerd Font:pixelsize=16;5"

modules-left = title
modules-center = date
modules-right = cpu gpu memory filesystem speed battery powermenu

separator =

tray-position = none
tray-detached = false
tray-maxsize = 16
tray-background = ${color.background}

enable-ipc = true

; i3
scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[settings]
throttle-output = 5
throttle-output-for = 10
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
