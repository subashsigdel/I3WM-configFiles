[module/launcher]
type = custom/text
content = ""
content-foreground = ${color.primary}
content-padding = 1
click-left = ~/.config/polybar/hack/scripts/launcher.sh &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
strip-wsnumbers = true
index-sort = true

format = <label-state>
format-padding = 1

label-focused = 
label-focused-foreground = ${color.primary}
label-focused-padding = 1

label-unfocused = 
label-unfocused-foreground = ${color.dim}
label-unfocused-padding = 1

label-visible = 
label-visible-foreground = ${color.secondary}
label-visible-padding = 1

label-urgent = 
label-urgent-foreground = ${color.red}
label-urgent-padding = 1

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/title]
type = internal/xwindow
format = <label>
format-padding = 1
label = %title%
label-maxlen = 30
label-foreground = ${color.foreground-alt}
label-empty = Dr. KaKu

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/date]
type = internal/date
interval = 1

time = TAYGA SHANTI ANANTARAM  
time-alt = " %I:%M %p  %a, %d %b %Y"

format = <label>
label = %time%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/volume]
type = internal/alsa
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default
master-mixer = Master
interval = 5

format-volume = <ramp-volume>
format-muted = <label-muted>
format-muted-foreground = ${color.dim}

label-muted = 
label-volume = 

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/speed]
type = internal/network
interface = wlan0
interval = 1
accumulate-stats = true
unknown-as-up = true

format-connected = <ramp-signal>
format-connected-padding = 1
format-disconnected = <label-disconnected>
format-disconnected-padding = 1
format-disconnected-foreground = ${color.dim}

ramp-signal-0 = ""
ramp-signal-1 = ""
ramp-signal-2 = ""
ramp-signal-foreground = ${color.teal}

label-disconnected = ""

click-left = networkmanager_dmenu &
click-right = networkmanager_dmenu &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-suffix = " "
format-suffix-foreground = ${color.green}
format-padding = 1
label = %percentage%%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/gpu]
type = custom/script
exec = ~/.config/i3/scripts/gpu_usage
interval = 2
format = <label>
format-suffix = " "
format-suffix-foreground = ${color.purple}
format-padding = 1
label = %output%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-suffix = " 󰍛"
format-suffix-foreground = ${color.yellow}
format-padding = 1
label = %mb_used%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-suffix = " "
format-mounted-suffix-foreground = ${color.blue}
format-mounted-padding = 1
label-mounted = %free%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-full-prefix = " "

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Full

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-framerate = 750

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/powermenu]
type = custom/text
content = 
content-foreground = ${color.red}
content-padding = 1
click-left = ~/.config/polybar/hack/scripts/powermenu.sh &
