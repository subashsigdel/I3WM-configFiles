shell            /usr/bin/fish

font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        11.0

background_opacity 0.82
dynamic_background_opacity yes

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

cursor_shape beam
cursor_blink_interval 0

enable_audio_bell no

# Pastel dark theme, pairs with the polybar "rice" colors
foreground              #F5E6EC
background              #1A1720
selection_foreground    #1A1720
selection_background    #F2A9C0

cursor                  #F2A9C0

color0  #1A1720
color8  #5C5560

color1  #E86C8B
color9  #F2A9C0

color2  #9CDCC1
color10 #B7E9D4

color3  #F2D6A2
color11 #F7E4BE

color4  #A6C8F0
color12 #C2DBF6

color5  #C9A6E8
color13 #DCC5F2

color6  #9CDCE0
color14 #C0EDEF

color7  #F5E6EC
color15 #FFFFFF

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
