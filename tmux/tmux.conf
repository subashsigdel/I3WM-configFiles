set -g mouse on
set -g status off

# Pass mouse drag back to terminal — normal copy/paste, no tmux copy mode
unbind -n MouseDrag1Pane
bind -n MouseDrag1Pane send-keys -M

# Vi keys in copy mode (still accessible via Ctrl+B [ if ever needed)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
